# Online-train TopoRA beside the tiny live snapy W92 shallow-water case using
# two CUDA devices for the TopoRA sidecar. The snapy mesh runs low_only (see
# _build_runner): the high-resolution truth from two_process mode isn't
# consumed as a target yet (live samples use synthetic terrain, not real
# geography aligned to the snapy domain), so it's not worth the extra process.
# snapy_w92_tiny.yaml has blocks_per_process: 6 (six cubed-sphere faces);
# every step trains on all six as one real batch (snapy_state_to_samples), so
# device_ids: [0, 1] gives DataParallel six genuinely different samples to
# split 3-and-3 across the GPUs, instead of duplicating one sample.

seed: 31
device: cuda:0
parallel:
  device_ids: [0, 1]

output_dir: /data00/topora_online_w92_tiny_2gpu
init_from: weights/topora_distill_best.pt
num_updates: 5
learning_rate: 0.0001
static_tile_count: 6
coarse_dx: 1000

snapy:
  config: configs/snapy_w92_tiny.yaml
  mode: low_only
  device: cpu
  velocity_scale: 0.1
  coarse_cells: 9

training:
  gradient_steps_per_update: 2

acceptance:
  seam_tolerance: 0.25
  max_speed: 100.0

model:
  static_channels: 5
  dynamic_channels: 6
  embed_dim: 24
  depth: 3
  latent_size: 30
  refine_channels: 16
  refine_depth: 3
  z_channels: 16
  z_depth: 2
  z_basis_rank: 4

loss:
  alpha: 1.0
  beta: 0.01
  gamma: 0.01
  weak_weight: 1.0
  lambda_coarse: 0.05
  lambda_speed: 0.5
