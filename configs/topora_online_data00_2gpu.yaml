# Online-train TopoRA beside a process-isolated two-resolution snapy W92 case.
# Low/high snapy workers are pinned to separate CUDA devices; TopoRA uses
# DataParallel across the same two devices.

seed: 31
device: cuda:0
parallel:
  device_ids: [0, 1]
  live_repeat: 2

output_dir: /data00/topora_online_w92_tiny_2gpu
init_from: weights/topora_distill_best.pt
num_updates: 5
learning_rate: 0.0001
static_tile_count: 2
coarse_dx: 1000

snapy:
  config: configs/snapy_w92_tiny.yaml
  mode: two_process
  low_device: cuda:0
  high_device: cuda:1
  velocity_scale: 0.1
  coarse_cells: 9

training:
  gradient_steps_per_update: 2

acceptance:
  seam_tolerance: 0.25
  max_speed: 100.0

model:
  static_channels: 5
  dynamic_channels: 6
  embed_dim: 24
  depth: 3
  latent_size: 30
  refine_channels: 16
  refine_depth: 3
  z_channels: 16
  z_depth: 2
  z_basis_rank: 4

loss:
  alpha: 1.0
  beta: 0.01
  gamma: 0.01
  weak_weight: 1.0
  lambda_coarse: 0.05
  lambda_speed: 0.5
