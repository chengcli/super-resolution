[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "super-resolution"
version = "0.1.0"
description = "Two-resolution Snapy shallow-water downscaling experiments."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Cheng Li" },
]
dependencies = [
  "numpy",
  "pyyaml",
  "torch",
  "snapy",
  "paddle",
]

[project.optional-dependencies]
dev = [
  "pytest>=7",
]

[project.scripts]
super-resolution-run = "super_resolution.cli:main"
topora-online-run = "super_resolution.topora_online:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
